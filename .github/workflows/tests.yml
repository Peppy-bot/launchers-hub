name: Tests

# Launches the launchers this repository publishes, from start to end. The
# inventory is discovered from the repository on each run rather than
# maintained by hand: `peppy_repository.json5` names the launchers, each
# launcher's own `components` name its selections. A launcher added tomorrow,
# and every combination of its axes, is planned in CI on the pull request that
# adds it.
#
# peppy and the hub repositories come from the shared hub-ci-peppy action of
# the peppy repository, the one the CI of every hub installs peppy with. It
# writes the daemon's repository registry: this checkout as the launchers-hub
# entry, and every sibling hub (the nodes, contracts, pairings and exposures
# these launchers deploy, and the private hub whenever its deploy key reached
# the job) pinned at the commit of its branch named like the pull request's
# head branch where it has one, and at its main otherwise. A launcher is thus
# launched against the nodes and contracts actually published, or against
# the sibling changes made on a branch of the same name. The job summary names
# the hub commits that ran.
#
# The peppy release starts this workflow too, through workflow_dispatch, with
# two inputs: the peppy release run whose archive the action installs, and
# the set of hub commits the release recorded, which the action pins in place
# of the branch lookup. Both jobs then check out the launchers-hub commit of
# that set, because main can move between the moment the release records the
# set and the moment this run starts, and every combination is planned.
#
# Every combination is resolved on every run; a subset is launched. A launch
# proves that each node instance it deploys builds, starts and signals ready
# as configured, beside the instances it runs with, and most combinations
# deploy instances some other combination runs the same way. The planner
# keeps the launches that, between them, run every configured node instance
# the launchable combinations deploy and every pair of instances any of them
# runs side by side, and that launch every launcher at least once. The run
# summary names, for each combination left out, the launches that stand for
# it.
#
# A pull request narrows that to what it can reach. A launcher's whole
# behaviour is the plan its combinations resolve to, so a change confined to
# launcher files (a launcher, or a fragment any option references) reaches
# exactly the combinations whose resolved plan differs from the one the base
# tree gives them, and only those are planned. A change outside every
# launcher (this workflow, the skips file, the repository index, ...) plans
# every combination, as does every push to main and every run the peppy
# release dispatches; a Markdown file outside every launcher is the one
# exception, planning nothing.
#
# Two jobs. `discover` enumerates the launchers and every combination of
# their axes (printed to its log and the run summary), scopes them to the
# diff, and plans: `peppy repo index --check` holds every launcher's whole
# selection space to the structural checks a launch would run, and
# `peppy stack resolve` splits the combinations into the launchable, the
# refused (the launcher's own constraints, quoted), and the skipped (a
# deployed node needs hardware the runner has none of, per
# .github/unlaunchable-nodes.json5). The resolve also holds each flat plan to
# the link rules a launch would reject it for, reading the manifest of every
# node it deploys, so `discover` boots a daemon of its own and refreshes the
# hub repositories into this machine's caches before it plans; a resolve
# reporting those rules unchecked fails the job, except where the caches could
# not be filled for a reason the workflow already tolerates, which today is a
# fork's pull request with no deploy key for the private hub: there the run
# summary names every combination left unproven and the job stays green. The
# launches picked among the launchable ones are the plan the second job runs.
# `launch` checks out the commit `discover` planned from, installs peppy,
# boots one isolated daemon, whose registry resolves a launcher by name to
# this checkout, and runs the planned launches one after the other: `peppy
# stack launch` resolves the launcher, adds each deployment's node, builds its
# container image, and runs it, returning only once every node has signalled
# ready. A launch that plans a join then runs `peppy stack join`, plain or
# with its words, beside whatever copies the file deploys: two robots side by
# side where it deploys one, and the scene's first robot where it deploys
# none. One join per launch is what a plan carries, so a simulation standing
# three robots or more is proven by hand and not here.
# The joined copy is held to the instances its preview gave it. `peppy stack
# list` then records what came up and `peppy stack reset` hands the next
# launch an empty stack. A failed launch is named and the run goes on, so a
# red run names every failing combination. Refused and skipped
# combinations are validated by `discover` alone and named, with reasons, in
# the run summary.
#
# The launches share one job because everything around a launch costs as
# much as a warm launch itself: the release archive, the hub repositories
# the daemon clones, the daemon's boot. One job pays for them once.
#
# A launch builds every deployed node's image through the daemon's bundled
# apptainer, so the launch job follows the nodes-hub and openarm-nodes test
# workflows: install a peppy release, ready its apptainer for unprivileged
# use, boot an isolated daemon. The rebuildable caches live on the launch
# job's sticky disk: apptainer's pulled layers, uv's wheels and interpreters,
# the daemon's container build cache (the crates.io registry and sccache the
# Rust nodes compile through), and the daemon's build artifact cache, where
# every built node image sits under the fingerprint of the staged sources it
# was built from (the node's tree, its def, its generated code and the peppy
# version). A launch reuses an image whose fingerprint it finds and builds the
# rest, so a run rebuilds exactly the nodes whose sources moved since the
# launches its snapshot comes from built them. RunsOn restores the disk from
# the newest snapshot of the same branch, or of main for a branch's first
# run, and snapshots it after the job. A pull request's run reads main's
# snapshot but never writes it; every push to main launches every
# combination, and that run is what keeps main's snapshot current. Nothing
# kept there may be state one run depends on another having written, only
# what apptainer, uv and the daemon rebuild from scratch, all of it keyed by
# content, so an entry is either a hit for the same bytes or a miss. The
# fingerprint does not cover a def's floating base image tag, so a moved base
# image reaches a cached node image when that image's fingerprint next
# changes: at the next peppy release, or at the next change to the node's
# sources.
#
# Every job runs on a RunsOn runner: an EC2 instance of its own, booted from
# the peppy-ubuntu24 image for the job and discarded after it, sized by the
# job's runs-on label. A pull request from a fork runs on the same runners, so
# what holds fork code is the repository's fork-PR approval gate.
on:
  push:
    branches: [main]
  pull_request:
  # The run the peppy release starts. For every other event both inputs are
  # empty, and the action resolves the hubs by branch name.
  workflow_dispatch:
    inputs:
      peppy-run-id:
        description: The peppy release run whose release archive artifact is the peppy to install
        type: string
        required: true
      set:
        description: 'The hub commits the peppy release recorded, as {"hubs": {"<hub>": {"ref": "<label>", "commit": "<40 hex>"}, ...}}'
        type: string
        required: true

# A pull request's new push cancels its previous run, and a push to main the
# run of the push before it. A dispatched run's group is its own run id, so it
# is never cancelled and cancels nothing.
concurrency:
  group: tests-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover and plan the launcher combinations
    # A light runner: no container runs here and nothing is built. The daemon
    # below serves `peppy repo refresh` alone, filling the caches the resolve
    # reads node manifests out of, and the planner resolves every combination.
    #
    # The budget covers the cold clone of every hub repository on top of the
    # planner's own work; the trees are a few tens of megabytes between them.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=4/ram=8+16/family=c8a+c7a+m8a+m7a  # custom Peppy AMI
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      # The commit under test: the launchers-hub commit of the set a
      # dispatched run carries, else the pull request's head, else the pushed
      # commit. The launch job checks out the commit this job resolved.
      - id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.set && fromJSON(inputs.set).hubs['launchers-hub'].commit || github.event.pull_request.head.sha || github.sha }}
          # Full history: the scoping step diffs the pull request against
          # its base to decide which launchers to run.
          fetch-depth: 0
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The inventory, printed for the person reading the run: every
      # launcher this repository publishes and every combination of its
      # component axes, discovered, not maintained. Runs on every event —
      # even a documentation-only pull request shows what exists, and the
      # run summary keeps the listing beside the verdicts of the plan.
      - name: Show every launcher and combination found
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/launcher_combinations.py enumerate \
            > "$RUNNER_TEMP/inventory.tsv"

          listing=$(awk -F'\t' '
            $1 == "launcher" { printf "**%s** — %s\n", $2, $3; next }
            $1 == "combo" {
              selection = ($3 == "" ? "defaults" : $3)
              n = split($4, started, ",")
              for (i = 1; i <= n; i++) selection = selection " --join " started[i] ":bravo"
              if ($5 != "") selection = selection " + join " $5 ($6 == "" ? "" : " (" $6 ")")
              if ($7 == "local") selection = selection " (--local)"
              print "- " selection
            }
          ' "$RUNNER_TEMP/inventory.tsv")
          printf '%s\n' "$listing"
          {
            echo
            echo "### Every launcher and combination found"
            echo
            printf '%s\n' "$listing"
          } >> "$GITHUB_STEP_SUMMARY"

      # What the change can reach, decided from the files it touches before
      # anything is installed: every combination, the combinations whose
      # resolved plan the change moves, or nothing. A pull request is
      # compared with the commit it branched from, whose tree is extracted
      # beside the checkout so the plan step can resolve the same
      # combinations in both and keep the ones that differ. The launcher
      # files of both trees count, so a fragment the pull request deletes is
      # still a launcher file. The comparison fails open: a base that cannot
      # be found or read scopes the run to every combination, as does every
      # other event: a push to main, or a run the peppy release dispatches.
      # The decision and its reason are written to the run summary, so a
      # scoped run never silently reads as full coverage.
      - name: Scope the run to what the change can reach
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scope_args=(--scope "$RUNNER_TEMP/scope.json")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            mkdir -p "$RUNNER_TEMP/base"
            if base=$(git merge-base "$BASE_SHA" HEAD) \
              && git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files.txt" \
              && git archive "$base" | tar -x -C "$RUNNER_TEMP/base"; then
              scope_args+=(--changed-files "$RUNNER_TEMP/changed-files.txt" --base-root "$RUNNER_TEMP/base")
            else
              echo "::warning::could not read the pull request's base; running every combination"
            fi
          fi
          python3 .github/scripts/launcher_combinations.py scope "${scope_args[@]}"

      # The action unpacks the whole peppy release archive under RUNNER_TEMP
      # and puts its bin on PATH, which gives the plan step the `peppy` it
      # resolves launchers with. `peppy stack resolve` reads the nodes cache
      # under PEPPY_HOME, and the action exports a PEPPY_HOME under
      # RUNNER_TEMP, beside everything else the job writes, holding the
      # registry the daemon started below refreshes into those caches before
      # the plan step resolves. peppy-run-id and set are the inputs of a run
      # the peppy release dispatches, and empty for every other event.
      #
      # The link rules the resolve holds each flat plan to are checked
      # against the manifest of every node the plan deploys, read out of this
      # machine's caches. The waldo simulation node lives in
      # Peppy-bot/private-nodes-hub, which only an authenticated reader can
      # clone, so the action gets a repository deploy key: a read-only one,
      # scoped to that repository alone, held as the
      # PRIVATE_NODES_HUB_DEPLOY_KEY secret. The action checks github.com's
      # host key, loads the key into an ssh-agent of this job's own, which
      # dies with the runner, exports the agent's socket for the daemon to
      # inherit, and registers the private hub. A fork's pull request runs
      # without this repository's secrets, so the key arrives empty, the
      # private hub stays unregistered, and the plan step names waldo's
      # manifest as one it could not read.
      - name: Install peppy and register the hub repositories
        id: peppy
        if: steps.scope.outputs.any == 'true'
        uses: Peppy-bot/peppy/.github/actions/hub-ci-peppy@dev
        with:
          private-nodes-hub-deploy-key: ${{ secrets.PRIVATE_NODES_HUB_DEPLOY_KEY }}
          peppy-run-id: ${{ inputs.peppy-run-id }}
          set: ${{ inputs.set }}

      # The committed index against the repository, and with it every
      # launcher's whole selection space: an unlisted launcher, a moved
      # fragment, an option whose shape contradicts an adjustment, a dead
      # constraint — each is this check's refusal, on the pull request that
      # causes it, with no daemon and no containers. The launch job covers
      # only what a runner can actually run; this covers the rest.
      - name: Check the repository index and every selection it admits
        if: steps.scope.outputs.any == 'true'
        run: peppy repo index --check .

      # The daemon below builds nothing, but it runs the same pre-flight check
      # as any other and refuses to boot unless the apptainer install beside it
      # is ready for unprivileged use. The runner image restricts unprivileged
      # user namespaces through AppArmor (Ubuntu 24.04's default), so
      # `peppy container setup` installs the profile keyed to this run's
      # install, through sudo since stdin is not a terminal, as the launch job
      # does.
      - name: Ready the bundled apptainer for unprivileged use
        if: steps.scope.outputs.any == 'true'
        run: peppy container setup < /dev/null

      # `peppy repo refresh` is a daemon command, so the caches are filled by
      # a daemon of this job's own. Its data root is the PEPPY_HOME the action
      # exported, where the registry it wrote lives, and which is how the CLI
      # finds it. It builds and launches nothing, so it takes none of the
      # launch job's build caches, and its name carries the run id because
      # core-node names must be unique among daemons that can reach each
      # other.
      - name: Start a peppy daemon to fill this machine's caches
        if: steps.scope.outputs.any == 'true'
        run: |
          set -euo pipefail
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT" >> "$GITHUB_ENV"
          export PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-plan-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The node manifests and MCP exposure documents every flat plan names:
      # the registry names the hubs that publish the nodes, contracts,
      # pairings and exposures, and the private hub joins them whenever the
      # deploy key reached this job. The refresh clones each one and hands the
      # clone to the checkout cache, which is where the resolve below reads a
      # git-backed node's manifest from. With --strict, a hub that CI cannot
      # read fails this step instead of leaving its manifests out of the
      # caches. The planner resolves every launcher by its path in this
      # checkout.
      #
      # Where the set the action resolved holds no private hub, this step
      # carries that on to the plan step through LINK_RULES_UNPROVABLE, whose
      # value is the reason the run summary gives for every combination it
      # then leaves unproven. A fork's pull request reaches the plan step this
      # way and stays green.
      - name: Fill the caches the link rules read
        if: steps.scope.outputs.any == 'true'
        env:
          PRIVATE_NODES_HUB_REGISTERED: ${{ fromJSON(steps.peppy.outputs.set).hubs['private-nodes-hub'] != null }}
        run: |
          set -euo pipefail
          if [ "$PRIVATE_NODES_HUB_REGISTERED" != "true" ]; then
            echo "LINK_RULES_UNPROVABLE=the private hub is not registered and this machine holds no manifest for the nodes it publishes" >> "$GITHUB_ENV"
          fi
          peppy repo refresh --strict

      # Resolve every combination against the launcher file it comes from
      # and split it into the launchable, the refused (the launcher's own
      # constraints, quoted), and the skipped (a deployed node needs hardware
      # the runner has none of, per .github/unlaunchable-nodes.json5). Of the
      # launchable ones in scope, the launches that between them run every
      # configured node instance and every pair running side by side leave
      # as the plan the launch job runs. The resolve reads the caches filled
      # above and talks to no daemon; a combination whose link rules it could
      # not check fails this step, naming the manifest it could not read,
      # unless the step above set LINK_RULES_UNPROVABLE, when those
      # combinations pass, stay out of the plan, and are listed in the run
      # summary under that reason.
      - name: Plan the combinations this run launches
        id: plan
        if: steps.scope.outputs.any == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/launcher_combinations.py plan \
            --scope "$RUNNER_TEMP/scope.json" \
            --base-root "$RUNNER_TEMP/base" \
            --skips .github/unlaunchable-nodes.json5 \
            --plan "$RUNNER_TEMP/plan.json"
          echo "plan=$(cat "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

  launch:
    name: Launch the planned combinations
    needs: discover
    # A documentation-only change plans nothing: no plan, no launch job, and
    # the run is green without booting a daemon; so does a change that moves
    # no launchable combination's plan.
    if: needs.discover.outputs.plan != '' && needs.discover.outputs.plan != '[]'
    # 8 vCPU with 16 or 32 GB (a full launch peaks near 10 GB) on the AMD
    # families c8a, c7a, m8a and m7a, where one vCPU is a full core. The
    # launches run one after the other: with the node images in the cache a
    # run keeps 2 cores busy on average and 3 at its peak, and a run that
    # rebuilds the images keeps 5 busy on average and 12 at its peak, which
    # 8 full cores serve about as fast as 16 Intel hyperthreads. Four
    # families in each zone give enough spot pools that a spot instance is
    # found at once. The 50 GB root disk holds apptainer's build scratch (a
    # full launch writes near 18 GB there), and the sticky disk holds the
    # caches named below.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=8/ram=16+32/family=c8a+c7a+m8a+m7a/volume=50gb:gp3:500mbs:6000iops/sticky=launches:200gb  # custom Peppy AMI
    # One job runs every planned launch. A cold run pulls the mujoco
    # simulation image, compiles the openarm Rust nodes, and resolves the
    # lerobot recorder's tree (torch included) inside its image build, once
    # each, since every launch after the first finds the image in the shared
    # cache below; warm runs stay far under this.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The commit the discover job planned from. Nothing here diffs
          # history; the launcher is resolved by name through the registry
          # the action below writes.
          ref: ${{ needs.discover.outputs.commit }}
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The rebuildable caches live in one directory on the job's sticky disk:
      # apptainer's pulled docker layers for every node base image, uv's
      # wheels and interpreters, and the two caches the daemon keeps under its
      # data root, handed to it below. runs-on/action bind-mounts the
      # directory onto the disk, which RunsOn restored before the job and
      # snapshots after it; RunsOn keeps a sticky disk per architecture, so
      # the layers and images are always the host's own. Every launcher shares
      # the one directory: the images the combinations launch are largely the
      # same images, and whichever launch builds one first serves all the
      # others.
      #
      # The apptainer cache is named too: the daemon this job boots inherits
      # the environment, so every node image it builds pulls its base layers
      # through (and into) the cache.
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
        with:
          sticky_cache: custom,path=~/.cache/launchers-hub-ci

      - name: Name the caches this run reuses
        run: |
          echo "CI_CACHE_DIR=$HOME/.cache/launchers-hub-ci" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$HOME/.cache/launchers-hub-ci/apptainer-cache" >> "$GITHUB_ENV"

      # Every node image bootstraps from a base on Docker Hub, and an
      # anonymous pull is charged against a quota tied to the address it comes
      # from, which a run that has to build images the cache does not hold yet
      # can exhaust partway through. Docker Hub reports the overage by
      # refusing a token with `unauthorized: incorrect username or password`,
      # which reads like a credential fault but is a quota. Authenticating
      # raises the ceiling and charges it to the account instead of the
      # address.
      #
      # Apptainer reads these two variables for every `docker://` bootstrap,
      # so the daemon this job boots inherits them and every node image it
      # builds pulls its base layers authenticated. They are exported only
      # when both secrets carry a value: a pull request from a fork is given
      # no secrets, and an empty username would have apptainer send empty
      # credentials and be refused outright, which is worse than the anonymous
      # pull it would otherwise have made.
      - name: Authenticate the base image pulls against Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_TOKEN:-}" ]; then
            {
              echo "APPTAINER_DOCKER_USERNAME=$DOCKER_USERNAME"
              echo "APPTAINER_DOCKER_PASSWORD=$DOCKER_TOKEN"
            } >> "$GITHUB_ENV"
            echo "Base image pulls authenticate as $DOCKER_USERNAME."
          else
            echo "No Docker Hub credentials in scope; pulls stay anonymous and count against this runner's address."
          fi

      # The action unpacks the whole peppy release archive under RUNNER_TEMP
      # and puts its bin on PATH: the daemon needs the bundled layout around
      # the binary (zenohd, and the apptainer install under bin/apptainer
      # that a later step readies). It exports the PEPPY_HOME the daemon
      # below takes as its data root and writes there the registry the daemon
      # reads: this checkout as the launchers-hub entry, so a launch by name
      # resolves the launcher under test, and every sibling hub pinned by
      # commit.
      #
      # The waldo simulation node lives in Peppy-bot/private-nodes-hub, which
      # only an authenticated reader can clone, so the action gets a
      # repository deploy key: a read-only one, scoped to that repository
      # alone, held as the PRIVATE_NODES_HUB_DEPLOY_KEY secret. The action
      # checks github.com's host key, loads the key into an ssh-agent of this
      # job's own, which dies with the runner, exports the agent's socket for
      # the daemon to inherit, and registers the private hub. A fork's pull
      # request runs without this repository's secrets, so the key arrives
      # empty and the private hub stays unregistered: launchers that deploy
      # nothing from it keep passing from a fork, and the discover job leaves
      # the combinations that deploy from it out of the plan.
      - name: Install peppy and register the hub repositories
        uses: Peppy-bot/peppy/.github/actions/hub-ci-peppy@dev
        with:
          private-nodes-hub-deploy-key: ${{ secrets.PRIVATE_NODES_HUB_DEPLOY_KEY }}
          peppy-run-id: ${{ inputs.peppy-run-id }}
          set: ${{ inputs.set }}

      # The daemon refuses to boot unless the apptainer install it resolves
      # is ready for unprivileged use: `newuidmap` on PATH, and on a kernel
      # that restricts unprivileged user namespaces through AppArmor (Ubuntu
      # 24.04's default) a root-installed profile keyed to the canonical path
      # of that install's `starter` binary. The runner image keeps that
      # restriction, and every run unpacks its own install, so every run
      # readies it: `peppy container setup` applies whatever its fix script
      # needs through sudo when stdin is not a terminal, and rechecks before
      # exiting 0. The profile is keyed to the install's path under
      # RUNNER_TEMP, so it grants nothing beyond this run's binary.
      #
      # `apptainer build` runs a def's %post as fakeroot, which needs a
      # subordinate id range for the runner user besides newuidmap. The
      # runner image ships one; should it ever not, this allocates one past
      # the highest range in use rather than failing in a def's apt-get a
      # cold build later.
      - name: Ready the bundled apptainer for unprivileged use
        run: |
          set -euo pipefail
          peppy container setup < /dev/null

          user=$(id -un)
          for kind in subuid subgid; do
            if ! grep -qs "^$user:" "/etc/$kind"; then
              start=$(awk -F: 'BEGIN { m = 100000 } { e = $2 + $3; if (e > m) m = e } END { print m }' \
                "/etc/$kind" 2>/dev/null || echo 100000)
              sudo usermod "--add-${kind}s" "$start-$((start + 65535))" "$user"
            fi
          done

      # A node without an apptainer.def builds with the `build_cmd` its
      # manifest declares, `uv sync --no-editable` for the scaffolded Python
      # node and `cargo build --release` for the scaffolded Rust one, which
      # the daemon executes on ITS OWN PATH, not inside a container; on a
      # developer machine both tools are simply installed. Here they have to
      # be on the PATH the daemon is about to inherit, before the daemon
      # boots. The runner image installs uv in ~/.local/bin and rustup's cargo
      # in ~/.cargo/bin, and both directories are named on the PATH the later
      # steps and the daemon inherit; a tool missing from the image stops the
      # job here, named, rather than inside a node build. uv's cache and its
      # downloaded interpreters go to the sticky disk so a warm run resolves a
      # wheel or a Python it already has instead of fetching it.
      - name: Put uv and cargo on the PATH of the daemon's host-side build commands
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          for tool in uv cargo; do
            if ! command -v "$tool" > /dev/null; then
              echo "::error::the runner image has no $tool, which the daemon's host-side build commands run"
              exit 1
            fi
          done
          echo "$(uv --version), $(cargo --version)"
          {
            echo "$HOME/.local/bin"
            echo "$HOME/.cargo/bin"
          } >> "$GITHUB_PATH"
          mkdir -p "$CI_CACHE_DIR/uv/cache" "$CI_CACHE_DIR/uv/python"
          {
            echo "UV_CACHE_DIR=$CI_CACHE_DIR/uv/cache"
            echo "UV_PYTHON_INSTALL_DIR=$CI_CACHE_DIR/uv/python"
          } >> "$GITHUB_ENV"

      # The daemon's data root is the PEPPY_HOME the action exported, where
      # the registry it wrote lives. The CLI finds the daemon through
      # PEPPY_HOME/daemon_state.json5, so the run's own directory is discovery
      # and isolation from any other daemon in one, and the daemon gets a port
      # of its own. The name carries the run id because core-node names must
      # be unique among daemons that can reach each other.
      #
      # Two directories of the data root are the sticky disk's, linked in
      # before the daemon creates them: `built_nodes`, the build artifact
      # cache where a launch finds the image of a node whose staged sources
      # it already built, and `cache/container_build`, the crates.io
      # registry and sccache the daemon bind mounts into every Rust node's
      # image build. Both are keyed by content (the artifact by the staged
      # tree's fingerprint, sccache by the compiler invocation), so what
      # another job left there is always either a hit for the same bytes or
      # a miss.
      - name: Start an isolated peppy daemon
        run: |
          set -euo pipefail
          mkdir -p "$PEPPY_HOME/cache" "$CI_CACHE_DIR/built_nodes" "$CI_CACHE_DIR/container_build"
          ln -s "$CI_CACHE_DIR/built_nodes" "$PEPPY_HOME/built_nodes"
          ln -s "$CI_CACHE_DIR/container_build" "$PEPPY_HOME/cache/container_build"
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT" >> "$GITHUB_ENV"
          export PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-launchers-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The refresh clones every hub the registry names into the daemon's
      # caches, the private hub among them whenever the deploy key reached
      # this job, which is what puts `waldo:v1` into the nodes cache a launch
      # resolves against. With --strict, a hub that CI cannot read stops the
      # job here, before any launch.
      - name: Fill the caches the launches resolve against
        run: peppy repo refresh --strict

      # Every planned launch, one after the other on the daemon above: launch
      # the combination, join its copy where it plans one, beside the copies
      # the file deploys, record the resulting stack, and
      # reset it for the next launch. Each launch has a log group of its own
      # under its label; a failed one is annotated, the stack is reset, and
      # the run goes on, so a red run names every failing combination. The
      # run summary lists every launch with its outcome. The commands
      # themselves, and the build idle budget they raise, are the planner's
      # `launch` command.
      #
      # The plan reaches the shell through the environment rather than a
      # `${{ }}` expansion: its labels and launch words are data the shell
      # reads instead of source the shell parses.
      - name: Launch every planned combination start to end
        env:
          PLAN: ${{ needs.discover.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 .github/scripts/launcher_combinations.py launch --plan "$RUNNER_TEMP/plan.json"

      # Every launch ran on the one daemon, so when a launch failed its side
      # of the story is here: the end of the daemon's own log.
      - name: Show the end of the daemon's log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/peppy-serve.log" || true
