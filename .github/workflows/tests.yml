name: Tests

# Launches the launchers this repository publishes, from start to end, with
# the latest peppy release. The inventory is discovered from the repository
# on each run rather than maintained by hand: `peppy_repository.json5` names
# the launchers, each launcher's own `components` name its selections. A
# launcher added tomorrow, and every combination of its axes, is planned in
# CI on the pull request that adds it.
#
# Every combination is resolved on every run; a subset is launched. A launch
# proves that each node instance it deploys builds, starts and signals ready
# as configured, beside the instances it runs with, and most combinations
# deploy instances some other combination runs the same way. The planner
# keeps the launches that, between them, run every configured node instance
# the launchable combinations deploy and every pair of instances any of them
# runs side by side, and that launch every launcher at least once. The run
# summary names, for each combination left out, the launches that stand for
# it.
#
# A pull request narrows that to what it can reach. A launcher's whole
# behaviour is the plan its combinations resolve to, so a change confined to
# launcher files (a launcher, or a fragment any option references) reaches
# exactly the combinations whose resolved plan differs from the one the base
# tree gives them, and only those are planned. A change outside every
# launcher (this workflow, the skips file, the repository index, ...) plans
# every combination, as does a push to main whose tree no run has tested yet
# and the weekly run; a Markdown file outside every launcher is the one
# exception, planning nothing.
#
# Two jobs. `discover` enumerates the launchers and every combination of
# their axes (printed to its log and the run summary), scopes them to the
# diff, and plans: `peppy repo index --check` holds every launcher's whole
# selection space to the structural checks a launch would run, and
# `peppy stack resolve` splits the combinations into the launchable, the
# refused (the launcher's own constraints, quoted), and the skipped (a
# deployed node needs hardware the runner has none of, per
# .github/unlaunchable-nodes.json5). The launches picked among the
# launchable ones are the plan the second job runs. `launch` installs a
# peppy release, boots one isolated daemon, registers this checkout as the
# launcher repository in its place (the bundled entry points at GitHub main,
# which would resolve a pull request's launcher to the stale merged copy),
# and runs the planned launches one after the other: `peppy stack launch`
# resolves the launcher, adds each deployment's node, builds its container
# image, and runs it, returning only once every node has signalled ready;
# `peppy stack list` then records what came up and `peppy stack reset` hands
# the next launch an empty stack. A failed launch is named and the run goes
# on, so a red run names every failing combination. Refused and skipped
# combinations are validated by `discover` alone and named, with reasons, in
# the run summary.
#
# The launches share one job because everything around a launch costs as
# much as a warm launch itself: the release archive, the hub repositories
# the daemon clones, the daemon's boot. One job pays for them once.
#
# A launch builds every deployed node's image through the daemon's bundled
# apptainer, so the launch job follows the nodes-hub and openarm-nodes test
# workflows: install a peppy release, ready its apptainer for unprivileged
# use, boot an isolated daemon. Node and contract sources keep resolving
# through the bundled hub repositories at their latest main, which is the
# point: a launcher must keep launching against the nodes and contracts
# actually published. The runners are self-hosted and reused, so the
# rebuildable caches simply outlive the job in one directory per box:
# apptainer's pulled layers, uv's wheels and interpreters, the daemon's
# container build cache (the crates.io registry and sccache the Rust nodes
# compile through), and the daemon's build artifact cache, where every
# built node image sits under the fingerprint of the staged sources it was
# built from (the node's tree, its def, its generated code and the peppy
# version). A launch reuses an image whose fingerprint it finds and builds
# the rest, so a run rebuilds exactly the nodes whose sources moved since
# some earlier launch built them. Nothing mounts, clones or commits the
# directory: it is live, so a run reads what the run before it left and
# writes into what later runs build on. Nothing kept there may therefore be
# state one run depends on another having written, only what apptainer, uv
# and the daemon rebuild from scratch, all of it keyed by content, so an
# entry is either a hit for the same bytes or a miss. Each box runs one
# runner, which executes one job at a time, so concurrent writers are not a
# concern; a second runner on a box would make its directory shared mutable
# state and is a reason to revisit it. A run's launches all land on the box
# its launch job is scheduled on, and find the images earlier runs built on
# that box.
#
# Every job runs on those runners; no job uses a GitHub-hosted one. A pull
# request from a fork lands there too, so what keeps fork code off the box is
# the repository's fork-PR approval gate, not the runner it is scheduled on.
#
# A push to main runs only when its tree was never tested: a merge whose
# result is exactly the pull request's tested tree (the branch was up to
# date with main) is skipped, since the pull request's run is the run of
# that tree. The weekly run launches its plan with `--rebuild`, ignoring the
# artifact cache: the fingerprint does not cover a def's floating base image
# tag, so this is where a moved base image reaches every node, and where a
# launcher drifting from the published nodes is caught between pushes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC.
    - cron: '0 3 * * 1'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the pushed tree was already tested. A merge commit whose tree is
  # the pull request head's tree (main had not moved under the branch), or a
  # squash of such a branch, carries exactly the files a successful run of
  # this workflow already launched; a tree nobody ran (the branch was behind
  # main, a direct push) runs in full. Two trees with the same hash hold the
  # same bytes, so this is an identity, not a heuristic. The lookup fails
  # open: an API error reports the tree as untested and the run proceeds.
  tested-tree:
    name: Check whether this tree was already tested
    if: github.event_name == 'push'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.lookup.outputs.tested }}
    steps:
      - name: Look for a successful run of this workflow on the same tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          # The workflow file's name, off the ref GitHub reports for this run
          # (`owner/repo/.github/workflows/tests.yml@refs/heads/main`), so a
          # renamed file keeps looking at its own runs.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -uo pipefail
          workflow="${WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha') || tree=""
          tested=false
          if [ -n "$tree" ]; then
            # Newest first; the run of the pull request just merged is
            # normally the first one whose head commit shares the tree.
            while read -r head_sha run_url; do
              head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha' 2>/dev/null) || continue
              if [ "$head_tree" = "$tree" ]; then
                tested=true
                echo "Tree $tree was tested by $run_url (commit $head_sha)."
                echo "Tree \`${tree:0:12}\` was already tested by [a successful run]($run_url) of commit \`${head_sha:0:12}\`; nothing to launch." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=success&per_page=100" \
              --jq '.workflow_runs[] | "\(.head_sha) \(.html_url)"' 2>/dev/null | awk '!seen[$1]++')
          else
            echo "::warning::could not read the tree of $GITHUB_SHA; running every combination"
          fi
          if [ "$tested" = false ]; then
            echo "Tree ${tree:-?} has no successful run of $workflow; launching every combination."
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  discover:
    name: Discover and plan the launcher combinations
    needs: tested-tree
    # Skipped only when the gate above found the tree tested; on a pull
    # request or the weekly run the gate itself is skipped and this runs.
    if: ${{ !cancelled() && needs.tested-tree.outputs.tested != 'true' }}
    # The self-hosted runner is x86, and the cache directory below carries
    # the architecture, so moving this repository onto an arm runner starts
    # from an empty cache rather than a wrong-arch one. The launch job's base
    # images are published for both. No daemon and no container runs here,
    # only the planner and `peppy repo index`.
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the scoping step diffs the pull request against
          # its base to decide which launchers to run.
          fetch-depth: 0
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The inventory, printed for the person reading the run: every
      # launcher this repository publishes and every combination of its
      # component axes, discovered, not maintained. Runs on every event —
      # even a documentation-only pull request shows what exists, and the
      # run summary keeps the listing beside the verdicts of the plan.
      - name: Show every launcher and combination found
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/launcher_combinations.py enumerate \
            > "$RUNNER_TEMP/inventory.tsv"

          listing=$(awk -F'\t' '
            $1 == "launcher" { printf "**%s** — %s\n", $2, $3; next }
            $1 == "combo" {
              selection = ($3 == "" ? "defaults" : $3)
              if ($4 != "") selection = selection " + join " $4 ($5 == "" ? "" : " (" $5 ")")
              if ($6 == "local") selection = selection " (--local)"
              print "- " selection
            }
          ' "$RUNNER_TEMP/inventory.tsv")
          printf '%s\n' "$listing"
          {
            echo
            echo "### Every launcher and combination found"
            echo
            printf '%s\n' "$listing"
          } >> "$GITHUB_STEP_SUMMARY"

      # What the change can reach, decided from the files it touches before
      # anything is installed: every combination, the combinations whose
      # resolved plan the change moves, or nothing. A pull request is
      # compared with the commit it branched from, whose tree is extracted
      # beside the checkout so the plan step can resolve the same
      # combinations in both and keep the ones that differ. The launcher
      # files of both trees count, so a fragment the pull request deletes is
      # still a launcher file. The comparison fails open: a base that cannot
      # be found or read scopes the run to every combination. The decision
      # and its reason are written to the run summary, so a scoped run never
      # silently reads as full coverage.
      - name: Scope the run to what the change can reach
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          scope_args=(--scope "$RUNNER_TEMP/scope.json")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            mkdir -p "$RUNNER_TEMP/base"
            if base=$(git merge-base "$BASE_SHA" HEAD) \
              && git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files.txt" \
              && git archive "$base" | tar -x -C "$RUNNER_TEMP/base"; then
              scope_args+=(--changed-files "$RUNNER_TEMP/changed-files.txt" --base-root "$RUNNER_TEMP/base")
            else
              echo "::warning::could not read the pull request's base; running every combination"
            fi
          fi
          python3 .github/scripts/launcher_combinations.py scope "${scope_args[@]}"

      # Installed by extracting the release under RUNNER_TEMP rather than
      # through scripts/install.sh: nothing here wants a ~/.peppy, and the
      # job lives in the checkout and its own temp dir. The whole archive is
      # extracted, not just bin/peppy, because the launch job needs the
      # bundled layout around the binary — and this one needs the `peppy`
      # the plan step resolves launchers with. Set the PEPPY_VERSION
      # repository variable to pin a release; it defaults to the latest,
      # which is the point of this workflow: a launcher must keep launching
      # against the peppy actually shipped.
      #
      # PEPPY_VERSION reaches the script through the environment rather than
      # a `${{ }}` expansion, so its value is data the shell reads instead of
      # source the shell parses, and the shape check turns a typo into a
      # named failure rather than a 404 from a URL built out of it.
      #
      # The binary answers `--version` before building any app context, so
      # no PEPPY_HOME is needed here. `latest` resolves to a different
      # release over time, so the log and the run summary both record which
      # release this run actually executed.
      - name: Install peppy
        if: steps.scope.outputs.any == 'true'
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: |
          set -euo pipefail
          version="${PEPPY_VERSION:-latest}"
          if [[ "$version" == "latest" ]]; then
            channel="latest"
          elif [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="v${version#v}"
          else
            echo "PEPPY_VERSION must be 'latest' or a release such as 0.25.0, got: $version" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64 | amd64) arch="x86_64" ;;
            aarch64 | arm64) arch="aarch64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          dest="$RUNNER_TEMP/peppy-dist"
          mkdir -p "$dest"
          curl -fsSL --connect-timeout 10 --max-time 300 \
            "https://peppy.bot/$channel/peppy-$arch-unknown-linux-gnu.tgz" \
            | tar -xzf - -C "$dest"
          chmod +x "$dest/bin/peppy"
          echo "$dest/bin" >> "$GITHUB_PATH"

          # $GITHUB_PATH serves the steps after this one; this step names the
          # binary it just extracted by its full path.
          "$dest/bin/peppy" --version
          installed="Installed $("$dest/bin/peppy" --version) (channel: $channel)"
          printf '\n%s\n' "$installed" | tee -a "$GITHUB_STEP_SUMMARY"

      # The committed index against the repository, and with it every
      # launcher's whole selection space: an unlisted launcher, a moved
      # fragment, an option whose shape contradicts an adjustment, a dead
      # constraint — each is this check's refusal, on the pull request that
      # causes it, with no daemon and no containers. The launch job covers
      # only what a runner can actually run; this covers the rest.
      - name: Check the repository index and every selection it admits
        if: steps.scope.outputs.any == 'true'
        run: peppy repo index --check .

      # Resolve every combination against the launcher file it comes from
      # and split it into the launchable, the refused (the launcher's own
      # constraints, quoted), and the skipped (a deployed node needs hardware
      # the runner has none of, per .github/unlaunchable-nodes.json5). Of the
      # launchable ones in scope, the launches that between them run every
      # configured node instance and every pair running side by side leave
      # as the plan the launch job runs. Needs no daemon; needs peppy.
      - name: Plan the combinations this run launches
        id: plan
        if: steps.scope.outputs.any == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/launcher_combinations.py plan \
            --scope "$RUNNER_TEMP/scope.json" \
            --base-root "$RUNNER_TEMP/base" \
            --skips .github/unlaunchable-nodes.json5 \
            --plan "$RUNNER_TEMP/plan.json"
          echo "plan=$(cat "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

  launch:
    name: Launch the planned combinations
    needs: discover
    # A documentation-only change plans nothing: no plan, no launch job, and
    # the run is green without booting a daemon; so does a change that moves
    # no launchable combination's plan. Spelled out with `!cancelled()`
    # because the default condition also skips a job whose chain of needs
    # holds a skipped job, and the gate ahead of discover is skipped on
    # every pull request.
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.plan != '' && needs.discover.outputs.plan != '[]' }}
    runs-on: self-hosted
    # One job runs every planned launch. A cold run pulls the mujoco
    # simulation image, compiles the openarm Rust nodes, and resolves the
    # lerobot recorder's tree (torch included) inside its image build, once
    # each, since every launch after the first finds the image in the shared
    # cache below; warm runs stay far under this. The weekly run rebuilds
    # every image of every launch, so its budget is the larger one.
    timeout-minutes: ${{ github.event_name == 'schedule' && 720 || 180 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Nothing here diffs history; the launcher is resolved by name
          # through the repository registered below.
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # The rebuildable caches outlive the run in a directory on the
      # self-hosted runner: apptainer's pulled docker layers for every node
      # base image, uv's wheels and interpreters, and the two caches the
      # daemon keeps under its data root, handed to it below. Nothing mounts
      # or uploads it — the box is reused, so the directory is simply still
      # there. Every launcher shares the one directory: the images the
      # combinations launch are largely the same images, and a live directory
      # lets whichever launch builds one first serve all the others. The name
      # carries the architecture because the layers and images are built for
      # the host that built them.
      #
      # The apptainer cache is named too: the daemon this job boots inherits
      # the environment, so every node image it builds pulls its base layers
      # through (and into) the cache.
      - name: Name the caches this run reuses
        run: |
          echo "CI_CACHE_DIR=$HOME/.cache/launchers-hub-ci-$RUNNER_ARCH" >> "$GITHUB_ENV"
          echo "APPTAINER_CACHEDIR=$HOME/.cache/launchers-hub-ci-$RUNNER_ARCH/apptainer-cache" >> "$GITHUB_ENV"

      # Installed by extracting the release under RUNNER_TEMP rather than
      # through scripts/install.sh: nothing here wants a ~/.peppy, and the
      # whole job lives in the checkout and its own temp dir. The whole
      # archive is extracted, not just bin/peppy, because the daemon needs
      # the bundled layout around the binary (zenohd, and the apptainer
      # install under bin/apptainer that a later step readies). PEPPY_VERSION
      # pins a release; the default is latest.
      #
      # The binary answers `--version` before building any app context, so
      # no PEPPY_HOME is needed here. `latest` resolves to a different
      # release over time, so the log and the run summary both record which
      # release this run actually executed.
      - name: Install peppy
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: |
          set -euo pipefail
          version="${PEPPY_VERSION:-latest}"
          if [[ "$version" == "latest" ]]; then
            channel="latest"
          elif [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="v${version#v}"
          else
            echo "PEPPY_VERSION must be 'latest' or a release such as 0.25.0, got: $version" >&2
            exit 1
          fi

          case "$(uname -m)" in
            x86_64 | amd64) arch="x86_64" ;;
            aarch64 | arm64) arch="aarch64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          dest="$RUNNER_TEMP/peppy-dist"
          mkdir -p "$dest"
          curl -fsSL --connect-timeout 10 --max-time 300 \
            "https://peppy.bot/$channel/peppy-$arch-unknown-linux-gnu.tgz" \
            | tar -xzf - -C "$dest"
          chmod +x "$dest/bin/peppy"
          echo "$dest/bin" >> "$GITHUB_PATH"

          # $GITHUB_PATH serves the steps after this one; this step names the
          # binary it just extracted by its full path.
          "$dest/bin/peppy" --version
          installed="Installed $("$dest/bin/peppy" --version) (channel: $channel)"
          printf '\n%s\n' "$installed" | tee -a "$GITHUB_STEP_SUMMARY"

      # The daemon refuses to boot unless the apptainer install it resolves
      # is ready for unprivileged use: `newuidmap` on PATH, and on a kernel
      # that restricts unprivileged user namespaces through AppArmor (Ubuntu
      # 24.04's default) a root-installed profile keyed to the canonical path
      # of that install's `starter` binary. The VM is fresh, so every run
      # readies the install it just extracted: `peppy container setup` applies
      # whatever its fix script needs through sudo when stdin is not a
      # terminal, and rechecks before exiting 0. The Blacksmith image mounted
      # no AppArmor securityfs, so the step had nothing to do there; the
      # self-hosted runner does restrict userns through AppArmor, so this is
      # what installs the profile the daemon's pre-flight check demands. The
      # profile is keyed to the install's path under RUNNER_TEMP, so it grants
      # nothing beyond this run's binary.
      #
      # `apptainer build` runs a def's %post as fakeroot, which needs a
      # subordinate id range for the runner user besides newuidmap. The
      # runner image ships one; should it ever not, this allocates one past
      # the highest range in use rather than failing in a def's apt-get a
      # cold build later.
      - name: Ready the bundled apptainer for unprivileged use
        run: |
          set -euo pipefail
          peppy container setup < /dev/null

          user=$(id -un)
          for kind in subuid subgid; do
            if ! grep -qs "^$user:" "/etc/$kind"; then
              start=$(awk -F: 'BEGIN { m = 100000 } { e = $2 + $3; if (e > m) m = e } END { print m }' \
                "/etc/$kind" 2>/dev/null || echo 100000)
              sudo usermod "--add-${kind}s" "$start-$((start + 65535))" "$user"
            fi
          done

      # A node without an apptainer.def builds with the `build_cmd` its
      # manifest declares — `uv sync --no-editable` for the scaffolded
      # Python node — which the daemon executes on ITS OWN PATH, not inside
      # a container; on a developer machine uv is simply installed. The
      # runner image ships none, so it lands here, on the PATH the daemon
      # is about to inherit, before the daemon boots. The standalone
      # installer needs no root and touches only ~/.local/bin; uv's cache
      # and its downloaded interpreters go to the shared cache so a warm run
      # resolves a wheel or a Python it already has instead of fetching it.
      # Installed only when absent: the runner is reused, so every job after
      # the first would otherwise re-download the installer for nothing, and
      # the box takes one job at a time so that is queue time. The PATH export
      # is unconditional — a uv already on the box still has to be reachable
      # from the daemon this job boots.
      - name: Install uv for the daemon's host-side build commands
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if command -v uv > /dev/null; then
            echo "uv already installed: $(uv --version)"
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$CI_CACHE_DIR/uv/cache" "$CI_CACHE_DIR/uv/python"
          {
            echo "UV_CACHE_DIR=$CI_CACHE_DIR/uv/cache"
            echo "UV_PYTHON_INSTALL_DIR=$CI_CACHE_DIR/uv/python"
          } >> "$GITHUB_ENV"

      # The waldo simulation node lives in Peppy-bot/private-nodes-hub,
      # which only an authenticated reader can clone, so the daemon gets a
      # repository deploy key: a read-only one, scoped to that repository
      # alone, held as the PRIVATE_NODES_HUB_DEPLOY_KEY secret. peppy
      # authenticates ssh clones through the ssh-agent, so the agent's
      # socket is exported through GITHUB_ENV — the daemon the next step
      # starts inherits it, which is the whole handoff. The agent is this
      # job's own and dies with the runner.
      #
      # github.com's host key is pinned, not trusted on first sight: the
      # scan must fingerprint exactly GitHub's published ed25519 key, or
      # the job stops before any private bytes move. It lands in
      # ~/.ssh/known_hosts, where libgit2 — peppy's git transport —
      # checks it.
      - name: Give the daemon the private hub's deploy key
        env:
          PRIVATE_NODES_HUB_DEPLOY_KEY: ${{ secrets.PRIVATE_NODES_HUB_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # A fork's pull request runs without this repository's secrets,
          # so the key arrives empty: skip everything, and the private hub
          # below stays unregistered. Launchers that deploy nothing from
          # it must keep passing from a fork; the waldo combinations
          # cannot, for the same reason a fork cannot clone the hub.
          if [ -z "$PRIVATE_NODES_HUB_DEPLOY_KEY" ]; then
            echo "no deploy key for private-nodes-hub (fork pull request?); skipping"
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          scan="$(ssh-keyscan -t ed25519 github.com 2>/dev/null)"
          fingerprint="$(ssh-keygen -lf - <<<"$scan" | awk '{print $2}')"
          if [ "$fingerprint" != "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" ]; then
            echo "github.com fingerprints as $fingerprint, not GitHub's published ed25519 key" >&2
            exit 1
          fi
          printf '%s\n' "$scan" >>~/.ssh/known_hosts

          eval "$(ssh-agent -a "$RUNNER_TEMP/private-hub-agent.sock")" >/dev/null
          key="$(mktemp "$RUNNER_TEMP/private-hub-key.XXXXXX")"
          printf '%s\n' "${PRIVATE_NODES_HUB_DEPLOY_KEY%$'\n'}" >"$key"
          chmod 600 "$key"
          ssh-add "$key"
          rm -f "$key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >>"$GITHUB_ENV"

      # The daemon gets its own data root and port under RUNNER_TEMP: the CLI
      # finds it through PEPPY_HOME/daemon_state.json5, so pointing PEPPY_HOME
      # at the run's directory is discovery and isolation from any other
      # daemon in one. The name carries the run id because core-node names
      # must be unique among daemons that can reach each other.
      #
      # Two directories of the data root are the shared cache's, linked in
      # before the daemon creates them: `built_nodes`, the build artifact
      # cache where a launch finds the image of a node whose staged sources
      # it already built, and `cache/container_build`, the crates.io
      # registry and sccache the daemon bind mounts into every Rust node's
      # image build. Both are keyed by content (the artifact by the staged
      # tree's fingerprint, sccache by the compiler invocation), so what
      # another job left there is always either a hit for the same bytes or
      # a miss.
      - name: Start an isolated peppy daemon
        run: |
          set -euo pipefail
          PEPPY_HOME="$RUNNER_TEMP/peppy-home"
          mkdir -p "$PEPPY_HOME/cache" "$CI_CACHE_DIR/built_nodes" "$CI_CACHE_DIR/container_build"
          ln -s "$CI_CACHE_DIR/built_nodes" "$PEPPY_HOME/built_nodes"
          ln -s "$CI_CACHE_DIR/container_build" "$PEPPY_HOME/cache/container_build"
          PEPPY_MESSAGING_PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          {
            echo "PEPPY_HOME=$PEPPY_HOME"
            echo "PEPPY_MESSAGING_PORT=$PEPPY_MESSAGING_PORT"
          } >> "$GITHUB_ENV"
          export PEPPY_HOME PEPPY_MESSAGING_PORT

          nohup peppy service serve --core-node-name "ci-launchers-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/peppy-serve.log" 2>&1 &
          for _ in $(seq 1 30); do
            if [ -f "$PEPPY_HOME/daemon_state.json5" ]; then exit 0; fi
            sleep 1
          done
          echo "daemon did not come up; serve log:" >&2
          cat "$RUNNER_TEMP/peppy-serve.log" >&2
          exit 1

      # The bundled defaults register the GitHub copy of this repository.
      # With it present, a launch by name would resolve the pull request's
      # launcher to the stale main-branch copy instead of the checkout, so it
      # is removed and the checkout registered in its place. The other hub
      # repositories stay: the nodes, contracts and pairings these launchers
      # deploy genuinely live there, at their latest main — and the private
      # hub joins them from the reserved id band, registered like any other
      # git repository, whenever the deploy key reached this job: the refresh
      # below clones it over ssh, which is what puts `waldo:v1` into the
      # nodes cache a launch resolves against. On a fork's pull request the
      # key is empty and the registration is skipped with it.
      - name: Register this checkout as the launcher repository
        env:
          PRIVATE_NODES_HUB_DEPLOY_KEY: ${{ secrets.PRIVATE_NODES_HUB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          repo_id=$(grep -B 3 'Peppy-bot/launchers-hub' "$PEPPY_HOME/conf/repositories.json5" \
            | sed -n 's/.*id: *\([0-9]*\),.*/\1/p' | head -1)
          if [ -n "$repo_id" ]; then
            peppy repo remove "$repo_id"
          fi
          peppy repo add "$GITHUB_WORKSPACE"
          if [ -n "$PRIVATE_NODES_HUB_DEPLOY_KEY" ]; then
            peppy repo add git@github.com:Peppy-bot/private-nodes-hub.git --ref main --id 2000
          fi
          peppy repo refresh

      # Every planned launch, one after the other on the daemon above: launch
      # the combination, join its copy where it plans one (the copies the
      # file deploys making way for it), record the resulting stack, and
      # reset it for the next launch. Each launch has a log group of its own
      # under its label; a failed one is annotated, the stack is reset, and
      # the run goes on, so a red run names every failing combination. The
      # run summary lists every launch with its outcome. The commands
      # themselves, and the build idle budget they raise, are the planner's
      # `launch` command.
      #
      # The weekly run passes `--rebuild`: every node builds from its staged
      # sources even when the artifact cache holds its fingerprint, which is
      # how a def's floating base image tag, outside the fingerprint, reaches
      # the images the cache serves for the week after.
      #
      # The plan reaches the shell through the environment rather than a
      # `${{ }}` expansion: its labels and launch words are data the shell
      # reads instead of source the shell parses.
      - name: Launch every planned combination start to end
        env:
          PLAN: ${{ needs.discover.outputs.plan }}
          REBUILD: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          launch_args=(--plan "$RUNNER_TEMP/plan.json")
          [ "$REBUILD" = "true" ] && launch_args+=(--rebuild)
          python3 .github/scripts/launcher_combinations.py launch "${launch_args[@]}"

      # Every launch ran on the one daemon, so when a launch failed its side
      # of the story is here: the end of the daemon's own log.
      - name: Show the end of the daemon's log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/peppy-serve.log" || true
